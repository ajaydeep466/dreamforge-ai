services:
  - type: web
    name: dreamforge-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CF_API_TOKEN
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: CF_VIDEO_MODEL
        value: "alibaba/hh1.1-t2v"
